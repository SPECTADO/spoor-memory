# Release on a v* tag (ADR 0013, docs/operations.md "Releasing"): check that the tag, packages/server and packages/cli
# carry one version (deviations I30), run the whole CI, publish the npm package spoor-memory with provenance, then
# push the multi-arch image to GHCR (version tags; `latest` only when the tag is still main's head, ADR-0017, since ci.yml
# moves `latest` with every push to main). npm goes first: the install doc of server version X pins spoor-memory@X, so an
# image must never be pullable before its CLI exists. Secret: NPM_TOKEN (docs/operations.md).
name: release
on:
  push:
    tags: ["v*"]
permissions: { contents: read }
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: v
        name: Tag, packages/server and packages/cli must carry the same version
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::tag $GITHUB_REF_NAME is not v<major>.<minor>.<patch>[-pre]"
            exit 1
          fi
          for p in server cli; do
            got="$(jq -r .version "packages/$p/package.json")"
            if [ "$got" != "$version" ]; then
              echo "::error file=packages/$p/package.json::version is $got, the tag says $version"
              exit 1
            fi
          done
          prerelease=false
          if [[ "$version" == *-* ]]; then prerelease=true; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

  ci:
    needs: [version]
    uses: ./.github/workflows/ci.yml
    with: { skip_image: true }
    permissions: { contents: read, packages: write } # the called image job declares packages: write even when skipped

  npm:
    needs: [version, ci]
    runs-on: ubuntu-24.04
    permissions: { contents: read, id-token: write } # id-token: npm provenance (Sigstore)
    env:
      VERSION: ${{ needs.version.outputs.version }}
      NPM_DIST_TAG: ${{ needs.version.outputs.prerelease == 'true' && 'next' || 'latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc, cache: pnpm, registry-url: "https://registry.npmjs.org" }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter "spoor-memory..." build # the CLI plus its workspace dependency @spoor/shared (fresh checkout has no dist)
      - name: Point package.json at this repository (npm provenance requires a matching repository.url)
        working-directory: packages/cli
        run: |
          npm pkg set \
            repository.type=git \
            "repository.url=git+https://github.com/${GITHUB_REPOSITORY}.git" \
            repository.directory=packages/cli \
            "homepage=https://github.com/${GITHUB_REPOSITORY}/tree/main/packages/cli#readme" \
            "bugs.url=https://github.com/${GITHUB_REPOSITORY}/issues"
      - name: Pack, then install the tarball with npm and run spoor --help / --version
        run: node packages/cli/scripts/pack-smoke.mjs --install --out "$RUNNER_TEMP/npm"
      - name: Publish the tested tarball with provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ "$(npm view "spoor-memory@$VERSION" version 2>/dev/null)" = "$VERSION" ]; then
            echo "spoor-memory@$VERSION is already on npm; skipping (re-run of a partly failed release)"
            exit 0
          fi
          npm publish "$RUNNER_TEMP/npm/spoor-memory-$VERSION.tgz" --provenance --access public --tag "$NPM_DIST_TAG"

  image:
    needs: [version, npm]
    runs-on: ubuntu-24.04
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: head
        name: Is this tag still main's head? (ci.yml skipped latest for it while its CLI was not on npm yet)
        run: |
          main="$(git ls-remote origin refs/heads/main | cut -f1)"
          echo "is_main_head=$([ "$main" = "$GITHUB_SHA" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }} # lowercased by the action
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ needs.version.outputs.prerelease != 'true' && steps.head.outputs.is_main_head == 'true' }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
