# CI: lint, unit, server integration, server e2e, Playwright e2e, CLI package smoke test, compose smoke test, image build.
# Design: docs/design/deployment.md section 6.1. Actions are pinned by commit SHA (section 9 lists the releases).
# release.yml calls this workflow on v* tags (workflow_call) before it publishes anything.
name: ci
on:
  push:
    branches: [main]
  pull_request: {}
  workflow_call:
    inputs:
      skip_image:
        description: Skip the image build job (release.yml builds and pushes the image itself)
        type: boolean
        default: false
permissions: { contents: read }
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # the pgvector service container of the integration and e2e jobs (deviations D3 pins the image); unit tests ignore it
  DATABASE_URL: postgres://spoor:spoor@localhost:5432/spoor_test

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (version from packageManager)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm --filter @spoor/shared build # typecheck reads its dist/*.d.ts
      - run: pnpm typecheck

  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @spoor/shared build # the other packages import its dist/
      - run: pnpm -r run test:unit
      - name: CLI package smoke test (pack, file list, run the packed bin --help)
        run: pnpm --filter spoor-memory build && pnpm --filter spoor-memory test:pack

  integration:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg17
        env: { POSTGRES_USER: spoor, POSTGRES_PASSWORD: spoor, POSTGRES_DB: spoor_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U spoor -d spoor_test" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      SPOOR_JOBS: "off"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @spoor/shared build
      - run: pnpm --filter @spoor/server test:integration # REST + MCP tools against the real Postgres

  e2e-server:
    needs: [lint, unit, integration]
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg17
        env: { POSTGRES_USER: spoor, POSTGRES_PASSWORD: spoor, POSTGRES_DB: spoor_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U spoor -d spoor_test" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build # the e2e test drives the built CLI (packages/cli/dist/bin.js)
      - run: pnpm --filter @spoor/server test:e2e # real server in process + built CLI (BRIEF DoD 2 and 3)

  e2e-web:
    needs: [lint, unit, integration]
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg17
        env: { POSTGRES_USER: spoor, POSTGRES_PASSWORD: spoor, POSTGRES_DB: spoor_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U spoor -d spoor_test" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # Playwright is a dependency of packages/web only, so `pnpm exec` runs there
      - run: pnpm --filter @spoor/web exec playwright install --with-deps chromium
      # builds shared, server and web, then Playwright starts the built server (fake embedding model,
      # database <name>_web_e2e_test, random port) serving the built SPA
      - run: pnpm e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            packages/web/playwright-report
            packages/web/test-results
          if-no-files-found: ignore
          retention-days: 7

  compose-smoke:
    # BRIEF DoD 1 as an operator runs it (deviations H13): a fresh .env from .env.example, `docker compose up --build`,
    # health, the bootstrap admin logs in. Catches what the in-process e2e tests cannot (image name, compose file, initdb).
    needs: [lint, unit, integration]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: .env from .env.example with generated secrets
        run: |
          cp .env.example .env
          sed -i "s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=$(openssl rand -hex 24)/" .env
          sed -i "s/^POSTGRES_APP_PASSWORD=.*/POSTGRES_APP_PASSWORD=$(openssl rand -hex 24)/" .env
          sed -i "s/^SPOOR_ADMIN_EMAIL=.*/SPOOR_ADMIN_EMAIL=admin@example.com/" .env
          sed -i "s/^SPOOR_ADMIN_PASSWORD=.*/SPOOR_ADMIN_PASSWORD=smoke-test-password-1/" .env
      - run: docker compose up -d --build --wait --wait-timeout 600
      - name: healthz and bootstrap admin login
        run: |
          curl -fsS http://localhost:3000/healthz
          curl -fsS -o /dev/null -X POST http://localhost:3000/api/v1/auth/login \
            -H 'content-type: application/json' -H 'origin: http://localhost:3000' \
            -d '{"email":"admin@example.com","password":"smoke-test-password-1"}'
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v

  image:
    needs: [lint, unit, integration]
    if: ${{ !inputs.skip_image }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # build only (proves the linux/arm64 build); release.yml pushes on v* tags
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
